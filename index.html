<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="theme-color" content="#0f766e" />
  <title>Pak Kom Eco Track v2.6</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div id="toast" class="toast"></div>
  <section id="loginView" class="login-shell">
    <div class="brand-card">
      <div class="logo">🌿</div>
      <h1>Pak Kom Eco Track</h1>
      <p>Pendataan wadah makan dan tumbler siswa.</p>
      <form id="loginForm" class="form-card">
        <label>ID Guru / Admin<input id="loginId" autocomplete="username" placeholder="contoh: G001" required /></label>
        <label>Password<input id="loginPassword" type="password" autocomplete="current-password" placeholder="••••••" required /></label>
        <button id="loginBtn" class="btn primary full" type="submit">Masuk</button>
        <p id="loginHint" class="demo-note">Akun dikelola oleh administrator Pak Kom Eco Track.</p>
      </form>
    </div>
  </section>

  <div id="appView" class="app hidden">
    <aside class="sidebar">
      <div class="side-brand"><span>🌿</span><div><strong>Pak Kom</strong><small>Eco Track</small></div></div>
      <nav id="nav"></nav>
      <button id="logoutBtn" class="btn ghost full">Keluar</button>
    </aside>
    <main class="main">
      <header class="topbar">
        <button id="menuBtn" class="menu-btn">☰</button>
        <div><h2 id="pageTitle">Beranda</h2><p id="pageSubtitle"></p></div>
        <div id="userChip" class="user-chip"></div>
      </header>
      <section id="content" class="content"></section>
    </main>
  </div>

  <input id="studentImport" type="file" accept=".xlsx,.xls,.csv" hidden />
  <input id="teacherImport" type="file" accept=".xlsx,.xls,.csv" hidden />
  <script src="https://cdn.jsdelivr.net/npm/xlsx@0.18.5/dist/xlsx.full.min.js"></script>
  <script src="firebase-config.js"></script>
  <script type="module" src="app.js"></script>
</body>
</html>
