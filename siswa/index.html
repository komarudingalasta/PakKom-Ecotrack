<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0f766e">
  <title>PakKom EcoTrack • Portal Siswa</title>
  <link rel="stylesheet" href="siswa.css?v=9.2.0">
</head>
<body>
  <div id="toast" class="toast"></div>
  <section id="boot" class="center-card">
    <div class="brand-mark">🌿</div>
    <h1>PakKom EcoTrack</h1>
    <p>Menyiapkan portal siswa...</p>
  </section>

  <section id="login" class="login-shell hidden">
    <div class="login-card">
      <div class="brand-row"><span class="brand-mark">🌿</span><div><h1>PakKom EcoTrack</h1><p>Portal Siswa</p></div></div>
      <h2>Masuk sebagai Siswa</h2>
      <p class="muted">Gunakan NIS dan password yang diberikan sekolah.</p>
      <form id="loginForm">
        <label>NIS<input id="nis" inputmode="numeric" autocomplete="username" required></label>
        <label>Password<div class="password-row"><input id="password" type="password" autocomplete="current-password" required><button id="togglePwd" type="button">👁</button></div></label>
        <button id="loginBtn" class="btn primary full" type="submit">MASUK</button>
      </form>
      <div id="loginError" class="notice danger hidden"></div>
    </div>
  </section>

  <section id="app" class="app hidden">
    <header class="topbar">
      <div class="brand-row compact"><span class="brand-mark small">🌿</span><div><strong>PakKom EcoTrack</strong><small>Portal Siswa • v9.2.0</small></div></div>
      <button id="logoutBtn" class="btn ghost">Keluar</button>
    </header>
    <main id="content"></main>
    <nav class="bottom-nav">
      <button data-page="home" class="active"><span>⌂</span><b>Beranda</b></button>
      <a href="tugas/"><span>✓</span><b>Tugas</b></a>
      <button data-page="me"><span>👤</span><b>Saya</b></button>
    </nav>
  </section>

  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-firestore-compat.js"></script>
  <script src="../firebase-config.js"></script>
  <script src="siswa.js?v=9.2.0"></script>
</body>
</html>
